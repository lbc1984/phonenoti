; Hiển thị thông báo iPhone qua ANCS (Bluetooth LE)
;   env:s3  — LCDWIKI ES3C28P / ES3N28P (ESP32-S3 + màn 2.8", board đang dùng)
;   env:cyd — ESP32-2432S028R "Cheap Yellow Display" 2.8"

[platformio]
default_envs = s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    bodmer/TFT_eSPI@^2.5.43
    XPT2046_Touchscreen=https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/heads/master.zip
common_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1  ; cảm ứng đọc bằng XPT2046_Touchscreen, không qua TFT_eSPI
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DLOAD_GLCD=1  ; chữ hiển thị dùng font riêng trong include/fonts (tạo bằng tools/make_fonts.py)
    -DSPI_READ_FREQUENCY=20000000
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED  ; không cần quét thiết bị khác

; ---------------------------------------------------------------------------
; LCDWIKI ES3C28P / ES3N28P: ESP32-S3 N16R8 + màn IPS 2.8" ILI9341V (theo tài liệu của hãng)
;   Màn hình   ESP32-S3
;   CS         GPIO 10
;   DC/RS      GPIO 46
;   SDI/MOSI   GPIO 11
;   SCK        GPIO 12
;   SDO/MISO   GPIO 13
;   RESET      chung với chân reset của chip (CHIP_PU)
;   LED        GPIO 45 (mức cao = sáng)
; Cảm ứng điện dung FT6336 (bản ES3C28P): SDA 16, SCL 15, RST 18, INT 17
; ---------------------------------------------------------------------------
[env:s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi  ; flash QIO + PSRAM 8MB octal (N16R8)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.common_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DILI9341_DRIVER=1
    -DTFT_INVERSION_ON=1
    ; Nếu đỏ và xanh dương bị đổi chỗ: bỏ dấu ; ở dòng dưới
    ; -DTFT_RGB_ORDER=1
    ; Core 2.0.x trên S3: cổng mặc định FSPI của TFT_eSPI ghi nhầm thanh ghi -> dùng SPI3
    -DUSE_HSPI_PORT=1
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DUI_CTP_SDA=16
    -DUI_CTP_SCL=15
    -DUI_CTP_RST=18
    -DUI_CTP_INT=17

; ---------------------------------------------------------------------------
[env:cyd]
board = esp32dev
board_build.partitions = huge_app.csv
upload_speed = 921600
build_flags =
    ${env.common_flags}
    -DILI9341_2_DRIVER=1
    ; Bản CYD 2 cổng USB (USB-C + micro) dùng ST7789: thay dòng trên bằng 2 dòng dưới
    ; -DST7789_DRIVER=1
    ; -DTFT_INVERSION_ON=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DUI_TOUCH_CLK=25
    -DUI_TOUCH_MISO=39
    -DUI_TOUCH_MOSI=32
    -DUI_TOUCH_CS=33
    -DUI_TOUCH_IRQ=36
